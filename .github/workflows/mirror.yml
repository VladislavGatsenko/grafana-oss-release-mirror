name: Mirror Grafana OSS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror.yml"
      - "scripts/prepare_release.py"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grafana-oss-release-mirror
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out mirror automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep public-repository schedules active
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mirror
          date -u +%Y-%m-%dT%H:%M:%SZ > .mirror/heartbeat.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mirror/heartbeat.txt
          git commit -m "chore: keep scheduled mirror active"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  identity:
    if: github.event_name != 'schedule' || github.event.schedule != '41 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      matrix: ${{ steps.identity.outputs.matrix }}
      skip: ${{ steps.existing.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out mirror automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine current stable Grafana OSS release
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity"
          python3 scripts/prepare_release.py \
            --metadata-only \
            --metadata-output "$RUNNER_TEMP/identity/upstream-metadata.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail

          if draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" == "false" ]]; then
              echo "Published release $TAG already exists; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Removing stale draft release $TAG before rebuilding it."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create draft and preserve upstream metadata
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Grafana OSS $VERSION — unofficial mirror" \
            --notes "Parallel package preparation is in progress."
          gh release upload "$TAG" "$RUNNER_TEMP/identity/upstream-metadata.json"

  packages:
    needs: identity
    if: needs.identity.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.identity.outputs.tag }}
      PACKAGE_OS: ${{ matrix.package_os }}
      PACKAGE_ARCH: ${{ matrix.arch }}

    steps:
      - name: Check out mirror automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the exact upstream metadata for this release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$TAG" \
            --pattern upstream-metadata.json \
            --dir input

      - name: Download and verify one upstream package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_release.py \
            --prepare-package "$PACKAGE_OS" "$PACKAGE_ARCH" \
            --metadata-url "file://$PWD/input/upstream-metadata.json" \
            --output-dir dist

      - name: Upload verified package to the draft release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t package_assets < <(find dist -maxdepth 1 -type f -print)
          [[ "${#package_assets[@]}" -eq 1 ]]
          gh release upload "$TAG" "${package_assets[0]}"

  provenance:
    needs: identity
    if: needs.identity.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.identity.outputs.tag }}

    steps:
      - name: Check out mirror automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the exact upstream metadata for this release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$TAG" \
            --pattern upstream-metadata.json \
            --dir input

      - name: Prepare source, license, checksums, and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_release.py \
            --prepare-provenance \
            --metadata-url "file://$PWD/input/upstream-metadata.json" \
            --output-dir dist

      - name: Upload provenance assets to the draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes-file dist/RELEASE-NOTES.md
          mapfile -t provenance_assets < <(
            find dist -maxdepth 1 -type f \
              ! -name RELEASE-NOTES.md \
              ! -name upstream-metadata.json \
              -print | sort
          )
          [[ "${#provenance_assets[@]}" -eq 4 ]]
          gh release upload "$TAG" "${provenance_assets[@]}"

  publish:
    needs:
      - identity
      - packages
      - provenance
    if: >-
      needs.identity.outputs.skip != 'true' &&
      needs.packages.result == 'success' &&
      needs.provenance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.identity.outputs.tag }}

    steps:
      - name: Check out mirror automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every uploaded asset against its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          gh release download "$TAG" \
            --pattern MIRROR-SHA256SUMS \
            --dir verification
          gh release view "$TAG" \
            --json isDraft,assets \
            > verification/release.json
          python3 scripts/prepare_release.py \
            --verify-uploaded-assets verification/release.json \
            --mirror-manifest verification/MIRROR-SHA256SUMS

      - name: Publish the verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest

  cleanup:
    needs:
      - identity
      - packages
      - provenance
      - publish
    if: >-
      always() &&
      needs.identity.outputs.tag != '' &&
      needs.identity.outputs.skip != 'true' &&
      needs.publish.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.identity.outputs.tag }}

    steps:
      - name: Remove only an incomplete draft release
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" == "true" ]]; then
              echo "Deleting incomplete draft $TAG."
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "Release $TAG is already published; preserving it."
            fi
          else
            echo "No draft release $TAG remains to clean up."
          fi
